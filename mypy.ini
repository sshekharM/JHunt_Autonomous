[mypy]
python_version = 3.12
# pydantic-settings fills required fields from the environment; the plugin teaches mypy that.
plugins = pydantic.mypy
check_untyped_defs = True

# Third-party libraries that ship no type information (and have no stub package
# we depend on). Scoped per library so our own missing imports still fail.
[mypy-authlib.*]
ignore_missing_imports = True

[mypy-bs4.*]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True

[mypy-qrcode.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

# Optional dependency: app/ml/matcher.py falls back to TF-IDF when it is absent.
[mypy-sentence_transformers.*]
ignore_missing_imports = True
