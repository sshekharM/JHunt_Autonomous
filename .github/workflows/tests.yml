# Test CI — runs the pytest suite on Python 3.12 (the Dockerfile's runtime).
# The suite is self-contained: root conftest.py sets dummy secrets and all
# external services are mocked, so no database or Redis service is needed.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  # Tests that need a real PostgreSQL (tenant isolation relies on per-schema
  # search_path, which mocks cannot prove). They skip unless RUN_DB_TESTS=1.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jhans
          POSTGRES_PASSWORD: jhans_ci
          POSTGRES_DB: jhans_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jhans -d jhans_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_DB_TESTS: "1"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: jhans
      POSTGRES_PASSWORD: jhans_ci
      POSTGRES_DB: jhans_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Shared migrations round-trip (alembic/)
        env:
          APP_SECRET_KEY: ci-only-not-a-secret-32-bytes-xx
          MINIO_SECRET_KEY: ci-only
          GOOGLE_CLIENT_ID: ci-only
          GOOGLE_CLIENT_SECRET: ci-only
        run: |
          export FERNET_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          alembic upgrade head
          alembic downgrade base
      - name: Run integration tests
        run: pytest -q tests/integration

  # nginx/nginx.conf is mounted into conf.d by docker-compose.prod.yml; check it
  # parses and loads (self-signed throwaway certs stand in for the real ones).
  nginx-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: nginx -t
        run: |
          mkdir -p ssl
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=ci" \
            -keyout ssl/key.pem -out ssl/cert.pem
          docker run --rm --add-host app:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/ssl:/etc/nginx/ssl:ro" \
            nginx:alpine nginx -t
