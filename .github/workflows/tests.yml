# Test CI — runs the pytest suite on Python 3.12 (the Dockerfile's runtime).
# The suite is self-contained: root conftest.py sets dummy secrets and all
# external services are mocked, so no database or Redis service is needed.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  # Tests that need a real PostgreSQL (tenant isolation relies on per-schema
  # search_path, which mocks cannot prove). They skip unless RUN_DB_TESTS=1.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jhans
          POSTGRES_PASSWORD: jhans_ci
          POSTGRES_DB: jhans_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jhans -d jhans_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_DB_TESTS: "1"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: jhans
      POSTGRES_PASSWORD: jhans_ci
      POSTGRES_DB: jhans_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run integration tests
        run: pytest -q tests/integration
