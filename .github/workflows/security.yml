# Secure-repo baseline CI — two BLOCKING jobs: gitleaks (secret scan) and sast
# (static analysis). The SAST job is selected at scaffold time from
# project-manifest.json#quality.sast_engine (semgrep | veracode) by
# scaffold-copy.js#renderSecurityWorkflow. No org/repo/branch literals: GitHub
# context and repo-configured secrets supply every environment value.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        # Pinned to a full commit SHA (VULN-005): a floating @v2 tag could be
        # retagged to malicious code that runs in-repo with GITHUB_TOKEN.
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Static analysis (Semgrep)
        run: |
          python -m pip install semgrep==1.90.0 "setuptools<81"  # semgrep 1.90 deps import pkg_resources
          # `semgrep ci` needs a Semgrep Cloud token and has no --error flag;
          # scan with the public default ruleset and fail on any finding.
          # Excluded rules:
          #   python36-compatibility-*   - project targets Python 3.12.
          #   writable-filesystem-service - read_only containers deferred until each
          #     service's writable paths are mapped (tmpfs/volumes); tracked follow-up.
          # Excluded file (temporary):
          #   alembic/versions/0001 - downgrade drops enum types with f-string SQL over a
          #     literal name list; replace with postgresql.ENUM(...).drop() in the shared
          #     migration drift fix, then remove this --exclude.
          semgrep scan --config p/default --error --metrics=off \
            --exclude alembic/versions/0001_initial_shared_schema.py \
            --exclude-rule python.lang.compatibility.python36.python36-compatibility-Popen1 \
            --exclude-rule python.lang.compatibility.python36.python36-compatibility-Popen2 \
            --exclude-rule yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
